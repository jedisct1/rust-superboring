[package]
name = "superboring"
description = "Pure Rust cryptography with a BoringSSL-compatible subset of the boring API: RSA, ML-DSA signatures, AES-GCM encryption, SHA-2, and HMAC. Supports WebAssembly."
version = "0.1.16"
authors = ["Frank Denis <github@pureftpd.org>"]
edition = "2021"
license = "ISC"
repository = "https://github.com/jedisct1/rust-superboring"
homepage = "https://github.com/jedisct1/rust-superboring"
categories = ["wasm", "api-bindings", "cryptography"]
keywords = ["boringssl", "boring", "cryptography", "rsa", "wasm"]
readme = "README.md"
include = ["src/**/*.rs", "README.md", "LICENSE"]

[dependencies]
rrsa = { package = "rsa", version = "0.9.10", optional = true, features = [
    "getrandom",
    "hazmat",
    "pem",
    "sha2",
    "std",
    "u64_digit",
] }

rand = { version = "0.8.8", optional = true }
hmac-sha256 = { version = "1.1.15", optional = true, features = ["traits010"] }
hmac-sha512 = { version = "1.1.13", optional = true, features = [
    "traits010",
    "sha384",
] }
aes-keywrap = { version = "0.9.1", optional = true }
aes-gcm = { version = "0.11", optional = true }
ml-dsa = { version = "0.1.1", optional = true }

# Do not delete: this is a required hack for the wasm32-unknown-unknown target used by dependencies.
# Both major versions are in the tree (rsa pulls 0.2, the RustCrypto 0.2 traits pull 0.4),
# and each one needs to be told to use the JS backend. What a mess. Just to get random numbers.
[target.'cfg(all(any(target_arch = "wasm32", target_arch = "wasm64"), target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "wasi", target_env = "p1"))'.dependencies]
wasi-crypto-guest = { version = "0.1.7", optional = true }

[features]
default = ["enabled"]
enabled = ["rrsa", "rand", "hmac-sha256", "hmac-sha512", "aes-keywrap", "aes-gcm", "ml-dsa"]
wasi-crypto = ["wasi-crypto-guest"]
